<button mat-icon-button aria-label="Select a theme" matTooltip="Select a theme" [matMenuTriggerFor]="themeMenu">
  <mat-icon>format_color_fill</mat-icon>
</button>

<mat-menu #themeMenu="matMenu" class="theme-picker">
  <button *ngFor="let theme of themes" mat-menu-item (click)="selectTheme(theme.name)">
    <mat-icon [color]="theme.name === currentTheme ? 'accent' : ''">
      {{theme.name === currentTheme ? 'radio_button_checked' : 'radio_button_unchecked'}}
    </mat-icon>
    <span>{{theme.displayName}}</span>
    <mat-icon class="theme-example" [class]="theme.name" svgIcon="theme-example"></mat-icon>
  </button>
</mat-menu>
